<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" aria-hidden="true">
  <defs>
    <g id="walking-pose">
      <circle cx="0" cy="-60" r="14" />
      <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55" 
            stroke-width="12" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />
    </g>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="300" fill="#1a1a1a" rx="15" />

  <g transform="translate(160, 150)">
    <!-- Soft dark shadow (back) -->
    <use href="#walking-pose" fill="#333333" stroke="#333333" x="50" y="0" />
    
    <!-- Warm brown (middle) -->
    <use href="#walking-pose" fill="#A0522D" stroke="#A0522D" x="0" y="0" />
    
    <!-- Bright white figure (front) -->
    <use href="#walking-pose" fill="#FFFFFF" stroke="#FFFFFF" x="-50" y="0" />
    <use href="#walking-pose" fill="none" stroke="#888888" stroke-width="2" x="-50" y="0" />
  </g>
</svg>