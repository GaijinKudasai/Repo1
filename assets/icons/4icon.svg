<svg xmlns="http://www.w3.org/2000/svg" width="470" height="300" viewBox="0 0 470 300" aria-hidden="true">

  <!-- 1. White figure (back) - Black outline -->
  <!-- Black outline first -->
  <g transform="translate(290, 165)">
    <circle cx="0" cy="-60" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="15"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#1a1a1a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- White fill on top -->
  <g transform="translate(290, 165)">
    <circle cx="0" cy="-60" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="11"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. Dark Brown -->
  <g transform="translate(225, 165)">
    <circle cx="0" cy="-60" r="14" fill="#8D5524" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#8D5524" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. Gray -->
  <g transform="translate(160, 165)">
    <circle cx="0" cy="-60" r="14" fill="#555555" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#555555" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. Black figure (front) - White outline using the same technique -->
  <!-- White outline first (thicker) -->
  <g transform="translate(95, 165)">
    <circle cx="0" cy="-60" r="14" fill="#111111" stroke="#f0f0f0" stroke-width="15"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#f0f0f0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Black fill on top (slightly thinner) -->
  <g transform="translate(95, 165)">
    <circle cx="0" cy="-60" r="14" fill="#111111" stroke="#111111" stroke-width="11"/>
    <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55"
          fill="none" stroke="#111111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>