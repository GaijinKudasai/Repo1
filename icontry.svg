<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" aria-hidden="true">
  <defs>
    <g id="walking-pose">
      <circle cx="0" cy="-60" r="14" />
      <path d="M 0,-46 L 0,-10 M 0,-40 L 15,-20 L 25,2 M 0,-40 L -15,-22 L -10,0 M 0,-10 L 18,15 L 28,55 M 0,-10 L -18,15 L -8,55" 
            stroke-width="12" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />
    </g>
  </defs>

  <!-- Three walking figures - centered and larger -->
  <g transform="translate(200, 165)">
    <!-- Black shadow (back) -->
    <use href="#walking-pose" fill="#1a1a1a" stroke="#1a1a1a" x="48" y="0" />
    
    <!-- Brown figure (middle) -->
    <use href="#walking-pose" fill="#8B4513" stroke="#8B4513" x="0" y="0" />
    
    <!-- White figure (front) -->
    <use href="#walking-pose" fill="#ffffff" stroke="#ffffff" x="-48" y="0" />
    <use href="#walking-pose" fill="none" stroke="#555555" stroke-width="2.5" x="-48" y="0" />
  </g>
</svg>